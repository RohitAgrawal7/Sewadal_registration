[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Runtime on serverless uses /tmp via src/lib/prisma.ts
  DATABASE_URL = "file:./dev.db"
  PRISMA_CLI_BINARY_TARGETS = "native,debian-openssl-3.0.x,rhel-openssl-3.0.x"
  SESSION_SECRET = "swaadal-session-change-me-in-netlify"
